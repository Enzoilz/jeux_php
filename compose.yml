name: JeuxPHP
services:
  api:
    build: .
    working_dir: /usr/app
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/app
    command: php -init
    env_file:
      - .env
  db:
    image: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${DATABASENAME}
      - MYSQL_USER=${DATABASEUSER}
      - MYSQL_PASSWORD=${DATABASEPASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env

volumes:
  mysql_data